name: Daily Sales Pipeline

on:
  schedule:
    - cron: '0 8 * * *'   # 8am UTC = 2am CST / 3am CDT — runs before business day
  workflow_dispatch:        # allows manual trigger from GitHub UI

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          MS_TENANT_ID:      ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID:      ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET:  ${{ secrets.MS_CLIENT_SECRET }}
          SHOPIFY_B2B_TOKEN: ${{ secrets.SHOPIFY_B2B_TOKEN }}
          SHOPIFY_B2B_STORE: ${{ secrets.SHOPIFY_B2B_STORE }}
          SHOPIFY_DTC_TOKEN: ${{ secrets.SHOPIFY_DTC_TOKEN }}
          SHOPIFY_DTC_STORE: ${{ secrets.SHOPIFY_DTC_STORE }}
        run: python main.py

      - name: Upload output artifact
        uses: actions/upload-artifact@v4
        with:
          name: sales-data-${{ github.run_id }}
          path: output/
          retention-days: 30
